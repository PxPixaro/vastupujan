<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6d160f">
  <meta name="description" content="Animated Vastu Pujan invitation of Sanjay Shirsath Parivar">
  <title>Vastu Pujan Invitation</title>

  <style>
    :root {
      --maroon: #75140f;
      --deep-maroon: #3d0907;
      --gold: #f4be43;
      --soft-gold: #ffe8a3;
      --cream: #fff8e8;
      --poster-ratio: 1060 / 1484;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: #fff7df;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 213, 108, 0.34), transparent 35%),
        linear-gradient(145deg, #2c0605 0%, #77170f 50%, #260403 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        radial-gradient(circle, rgba(255, 220, 136, .9) 0 1px, transparent 1.7px),
        radial-gradient(circle, rgba(255, 159, 45, .75) 0 1px, transparent 1.8px);
      background-size: 44px 44px, 71px 71px;
      background-position: 0 0, 17px 29px;
      animation: backgroundDrift 22s linear infinite;
    }

    .page {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: clamp(12px, 3vw, 30px) clamp(10px, 2.5vw, 24px) 42px;
    }

      background-position: center;
      background-repeat: no-repeat;
      box-shadow:
        0 0 0 1px rgba(255, 220, 132, .55),
        0 18px 70px rgba(0, 0, 0, .58),
        0 0 46px rgba(255, 177, 48, .28);
      transform-origin: 50% 18%;
      animation: joyfulFloat 6.4s ease-in-out infinite;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: -28%;
      z-index: 4;
      pointer-events: none;
      opacity: .58;
      transform: translateX(-80%) rotate(12deg);
      background: linear-gradient(
        100deg,
        transparent 42%,
        rgba(255,255,255,.05) 47%,
        rgba(255,246,200,.50) 50%,
        rgba(255,255,255,.05) 53%,
        transparent 58%
      );
      mix-blend-mode: screen;
      animation: ceremonialSweep 8.5s ease-in-out infinite;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 5%, rgba(255, 250, 209, .62) 0%, rgba(255, 210, 75, .18) 19%, transparent 41%),
        radial-gradient(circle at 16% 27%, rgba(255, 229, 140, .15), transparent 17%),
        radial-gradient(circle at 84% 27%, rgba(255, 229, 140, .15), transparent 17%);
      mix-blend-mode: screen;
      animation: divinePulse 4.2s ease-in-out infinite;
    }

    .divine-rays {
      position: absolute;
      z-index: 6;
      top: -5.5%;
      left: 50%;
      width: 50%;
      aspect-ratio: 1;
      pointer-events: none;
      transform: translateX(-50%);
      opacity: .72;
      filter: blur(.2px);
      background: repeating-conic-gradient(
        from -8deg,
        rgba(255, 237, 170, .00) 0deg 8deg,
        rgba(255, 224, 120, .20) 8deg 11deg,
        rgba(255, 251, 220, .03) 11deg 19deg
      );
      border-radius: 50%;
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(circle, black 0 24%, rgba(0,0,0,.55) 42%, transparent 72%);
      mask-image: radial-gradient(circle, black 0 24%, rgba(0,0,0,.55) 42%, transparent 72%);
      animation: rayTurn 24s linear infinite;
    }

    .om-glow {
      position: absolute;
      z-index: 7;
      top: 1.8%;
      left: 50%;
      width: 16%;
      aspect-ratio: 1;
      pointer-events: none;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,235,.80), rgba(255,214,91,.25) 34%, transparent 70%);
      mix-blend-mode: screen;
      animation: omBlessing 3.2s ease-in-out infinite;
    }

    .kalash-effect {
      position: absolute;
      z-index: 8;
      top: 15.2%;
      width: 31%;
      aspect-ratio: 1;
      pointer-events: none;
      border-radius: 50%;
      filter: drop-shadow(0 0 9px rgba(255, 218, 110, .45));
    }

    .kalash-effect.left { left: .5%; }
    .kalash-effect.right { right: .5%; }

    .kalash-effect::before {
      content: "";
      position: absolute;
      inset: 3%;
      border-radius: 50%;
      background:
        conic-gradient(
          from 0deg,
          transparent 0deg 28deg,
          rgba(255, 247, 207, .85) 34deg 43deg,
          transparent 50deg 115deg,
          rgba(255, 190, 60, .55) 124deg 138deg,
          transparent 146deg 240deg,
          rgba(255, 247, 207, .72) 250deg 261deg,
          transparent 268deg 360deg
        );
      -webkit-mask-image: radial-gradient(circle, transparent 0 53%, black 58% 65%, transparent 71%);
      mask-image: radial-gradient(circle, transparent 0 53%, black 58% 65%, transparent 71%);
      animation: kalashAura 5.2s linear infinite;
    }

    .kalash-effect::after {
      content: "";
      position: absolute;
      top: 27%;
      left: 13%;
      width: 18%;
      height: 42%;
      border-radius: 50%;
      transform: rotate(24deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.82),
        rgba(255,228,150,.55),
        transparent
      );
      filter: blur(4px);
      mix-blend-mode: screen;
      animation: glintAcross 3.1s ease-in-out infinite;
    }

    .kalash-effect.right::after {
      animation-delay: 1.1s;
    }

    .sparkle-field,
    .petal-field {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sparkle-field { z-index: 9; }
    .petal-field { z-index: 10; }

    .spark {
      position: absolute;
      width: clamp(3px, .65vw, 8px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff8ca;
      box-shadow:
        0 0 5px #fff,
        0 0 12px #ffd35c,
        0 0 22px rgba(255, 184, 37, .75);
      animation: sparkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .spark::before,
    .spark::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      background: rgba(255, 250, 216, .88);
      transform: translate(-50%, -50%);
      border-radius: 999px;
    }

    .spark::before { width: 380%; height: 20%; }
    .spark::after  { width: 20%; height: 380%; }

    .petal {
      position: absolute;
      top: -8%;
      width: clamp(7px, 1vw, 13px);
      height: clamp(12px, 1.7vw, 21px);
      border-radius: 80% 15% 80% 15%;
      background: linear-gradient(145deg, #ffbd36, #eb690a 70%, #9a2505);
      box-shadow: 0 0 5px rgba(255, 174, 41, .28);
      opacity: .85;
      animation: petalFall var(--fall) linear infinite;
      animation-delay: var(--wait);
      transform-origin: 50% 50%;
    }

    .map-section {
      width: min(100%, 880px);
      margin: clamp(22px, 4vw, 38px) auto 0;
      padding: clamp(22px, 5vw, 36px);
      text-align: center;
      border: 1px solid rgba(255, 222, 139, .55);
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0, rgba(255, 218, 113, .19), transparent 45%),
        linear-gradient(145deg, rgba(104, 18, 12, .93), rgba(49, 6, 5, .94));
      box-shadow:
        0 18px 45px rgba(0, 0, 0, .34),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    .map-section h2 {
      margin: 0 0 9px;
      color: #ffe9ae;
      font-size: clamp(24px, 4.5vw, 42px);
      letter-spacing: .04em;
    }

    .map-section p {
      margin: 0 auto 21px;
      max-width: 650px;
      color: #fff4d5;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(15px, 2.4vw, 19px);
      line-height: 1.55;
    }

    .map-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 58px;
      padding: 14px 24px;
      overflow: hidden;
      border: 1px solid #ffe3a0;
      border-radius: 999px;
      color: #4c0b07;
      background: linear-gradient(135deg, #fff4c8, #f5b83e 55%, #fff0b8);
      box-shadow:
        0 10px 28px rgba(0,0,0,.35),
        0 0 24px rgba(255, 194, 59, .26);
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      font-size: clamp(16px, 2.5vw, 21px);
      text-decoration: none;
      transition: transform .25s ease, box-shadow .25s ease;
      animation: mapPulse 2.8s ease-in-out infinite;
    }

    .map-button::before {
      content: "";
      position: absolute;
      inset: -90% -35%;
      background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,.78) 50%, transparent 58%);
      transform: translateX(-80%);
      animation: buttonShine 3.4s ease-in-out infinite;
    }

    .map-button > span,
    .map-button > svg {
      position: relative;
      z-index: 1;
    }

    .map-button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow:
        0 15px 34px rgba(0,0,0,.42),
        0 0 35px rgba(255, 205, 77, .43);
    }

    .map-button:focus-visible {
      outline: 4px solid rgba(255, 238, 174, .8);
      outline-offset: 5px;
    }

    .map-url {
      margin-top: 14px !important;
      word-break: break-all;
      opacity: .74;
      font-size: 13px !important;
    }

    .footer-blessing {
      margin: 21px 0 0;
      text-align: center;
      color: #ffecc1;
      font-size: clamp(14px, 2vw, 17px);
      letter-spacing: .04em;
    }

    @keyframes joyfulFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.002); }
    }

    @keyframes backgroundDrift {
      from { background-position: 0 0, 17px 29px; }
      to { background-position: 44px 44px, 88px 100px; }
    }

    @keyframes ceremonialSweep {
      0%, 14% { transform: translateX(-80%) rotate(12deg); opacity: 0; }
      24% { opacity: .48; }
      55% { opacity: .58; }
      72%, 100% { transform: translateX(80%) rotate(12deg); opacity: 0; }
    }

    @keyframes divinePulse {
      0%, 100% { opacity: .42; }
      50% { opacity: .83; }
    }

    @keyframes rayTurn {
      to { transform: translateX(-50%) rotate(360deg); }
    }

    @keyframes omBlessing {
      0%, 100% { transform: translateX(-50%) scale(.86); opacity: .45; }
      50% { transform: translateX(-50%) scale(1.12); opacity: .95; }
    }

    @keyframes kalashAura {
      to { transform: rotate(360deg); }
    }

    @keyframes glintAcross {
      0%, 12% { transform: translate(-8%, 5%) rotate(24deg); opacity: 0; }
      34% { opacity: .92; }
      65% { transform: translate(350%, -10%) rotate(24deg); opacity: .75; }
      82%, 100% { transform: translate(420%, -15%) rotate(24deg); opacity: 0; }
    }

    @keyframes sparkle {
      0%, 100% { transform: scale(.25) rotate(0deg); opacity: 0; }
      35% { opacity: 1; }
      50% { transform: scale(1.05) rotate(45deg); opacity: 1; }
      78% { opacity: .55; }
    }

    @keyframes petalFall {
      0% {
        transform: translate3d(0, -12%, 0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: .85; }
      50% {
        transform: translate3d(var(--drift), 54vh, 0) rotate(360deg);
      }
      100% {
        transform: translate3d(calc(var(--drift) * -0.35), 112vh, 0) rotate(760deg);
        opacity: 0;
      }
    }

    @keyframes mapPulse {
      0%, 100% { filter: saturate(1); }
      50% { filter: saturate(1.18) brightness(1.05); }
    }

    @keyframes buttonShine {
      0%, 18% { transform: translateX(-85%); }
      55%, 100% { transform: translateX(85%); }
    }

    @media (max-width: 560px) {
      .page {
        padding-left: 6px;
        padding-right: 6px;
      }

      .stage {
        border-radius: 9px;
        animation-duration: 7.5s;
      }

      .map-section {
        border-radius: 18px;
        margin-left: 6px;
        margin-right: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    @media print {
      body {
        background: white;
      }

      body::before,
      .sparkle-field,
      .petal-field,
      .divine-rays,
      .om-glow,
      .kalash-effect,
      .map-section,
      .footer-blessing {
        display: none !important;
      }

      .page {
        padding: 0;
      }

      .stage {
        width: 100%;
        max-width: none;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="stage" aria-label="Animated Vastu Pujan invitation">
      <div class="divine-rays" aria-hidden="true"></div>
      <div class="om-glow" aria-hidden="true"></div>

      <div class="kalash-effect left" aria-hidden="true"></div>
      <div class="kalash-effect right" aria-hidden="true"></div>

      <div class="sparkle-field" id="sparkleField" aria-hidden="true"></div>
      <div class="petal-field" id="petalField" aria-hidden="true"></div>
    </section>

    <section class="map-section" aria-labelledby="map-title">
      <h2 id="map-title">📍 Open Venue in Google Maps</h2>
      <p>
        House No. 12, Silver Villa, Nr. Bharat Petroleum, Saniya Kande
      </p>

      <a
        class="map-button"
        href="https://maps.app.goo.gl/LgaQk8fbHiwffCic9"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open the Vastu Pujan venue in Google Maps"
      >
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/>
        </svg>
        <span>OPEN GOOGLE MAPS</span>
      </a>

      <p class="map-url">https://maps.app.goo.gl/LgaQk8fbHiwffCic9</p>
    </section>

    <p class="footer-blessing">May your presence make this auspicious celebration even more joyful.</p>
  </main>

  <script>
    (() => {
      const sparkleField = document.getElementById("sparkleField");
      const petalField = document.getElementById("petalField");

      const sparklePositions = [
        [8, 14], [19, 11], [33, 7], [48, 13], [62, 8], [79, 12], [91, 18],
        [13, 35], [31, 29], [69, 31], [86, 37], [10, 57], [39, 53], [62, 56],
        [88, 59], [19, 75], [49, 71], [78, 77], [13, 92], [41, 88], [66, 91], [91, 89]
      ];

      sparklePositions.forEach(([x, y], index) => {
        const item = document.createElement("span");
        item.className = "spark";
        item.style.left = `${x}%`;
        item.style.top = `${y}%`;
        item.style.setProperty("--duration", `${2.1 + (index % 5) * .55}s`);
        item.style.setProperty("--delay", `${(index % 8) * -.47}s`);
        sparkleField.appendChild(item);
      });

      for (let index = 0; index < 16; index += 1) {
        const petal = document.createElement("span");
        petal.className = "petal";
        petal.style.left = `${4 + ((index * 17.7) % 92)}%`;
        petal.style.setProperty("--fall", `${8 + (index % 6) * 1.35}s`);
        petal.style.setProperty("--wait", `${-1 * (index % 9) * 1.18}s`);
        petal.style.setProperty("--drift", `${-75 + ((index * 37) % 150)}px`);
        petalField.appendChild(petal);
      }
    })();
  </script>
</body>
</html>
